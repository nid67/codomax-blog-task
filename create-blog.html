<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog | Codomax Blog</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">
    <header class="navbar">
        <div class="logo">Codomax</div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <main class="editor-container">
        <h2>Draft a New Post</h2>
        <form id="createBlogForm">
            <div class="input-group">
                <label for="title">Blog Title</label>
                <input type="text" id="title" placeholder="Enter an engaging title" required>
            </div>
            <div class="input-group">
                <label for="content">Content</label>
                <textarea id="content" rows="10" placeholder="Write your thoughts here..." required></textarea>
            </div>
            <button type="submit" class="btn-primary">Publish Blog</button>
        </form>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
